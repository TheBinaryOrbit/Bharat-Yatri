<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Live tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee;
    --muted: #939aab; --accent: #4f9cf9; --ok: #3ddc97; --warn: #ffb347; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .pill {
    margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px;
    background: #1e222b; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: #245c45; }
  .pill.warn { color: var(--warn); border-color: #5c4a24; }
  .pill.err { color: var(--err); border-color: #5c2424; }

  #map { flex: 1 1 auto; min-height: 0; background: #0b0d11; }
  .leaflet-container { background: #0b0d11; }
  /* The default tile look is far too bright against this shell. */
  .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .leaflet-control-attribution {
    background: rgba(15,17,21,.85) !important; color: var(--muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  .car {
    width: 34px; height: 34px; border-radius: 50%; background: var(--ok);
    display: grid; place-items: center; font-size: 17px;
    box-shadow: 0 0 0 4px rgba(61,220,151,.25), 0 2px 10px rgba(0,0,0,.6);
  }
  .dot {
    width: 16px; height: 16px; border-radius: 50%; border: 3px solid #0f1115;
    box-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .dot.p { background: var(--accent); }
  .dot.d { background: var(--warn); }

  .sheet {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    padding: 14px 16px; max-height: 45vh; overflow: auto;
  }
  .who { display: flex; align-items: center; gap: 12px; }
  .who img, .who .ph {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
    background: #1e222b; border: 1px solid var(--line); flex: 0 0 auto;
    display: grid; place-items: center; font-size: 18px; color: var(--muted);
  }
  .who h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .who .sub { color: var(--muted); font-size: 13px; }
  .plate {
    margin-left: auto; font: 600 13px ui-monospace, Menlo, Consolas, monospace;
    padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap;
  }

  .leg { display: flex; gap: 10px; margin-top: 14px; }
  .rail { width: 12px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding-top: 5px; }
  .rail i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .rail span { flex: 1; width: 2px; background: var(--line); margin: 3px 0; min-height: 22px; }
  .rail i.end { background: var(--warn); }
  .leg .names { flex: 1; min-width: 0; }
  .leg .names div { font-size: 14px; }
  .leg .names div + div { margin-top: 24px; }
  .leg .names .lbl { font-size: 11px; color: var(--muted); margin-bottom: 1px; }

  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    padding: 5px 10px; border-radius: 7px; background: #1e222b;
    border: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }

  .note {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--line); background: #1e222b; color: var(--muted);
  }
  .note.ok  { border-color: #245c45; color: var(--ok); background: #0d1a15; }
  .note.err { border-color: #5c2424; color: var(--err); background: #170f0f; }

  /* Full-screen states: an invalid link and a finished trip both land here. */
  .screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 2000;
    display: none; place-items: center; padding: 28px; text-align: center;
  }
  .screen.show { display: grid; }
  .screen .icon { font-size: 46px; margin-bottom: 12px; }
  .screen h2 { margin: 0 0 8px; font-size: 19px; }
  .screen p { margin: 0; color: var(--muted); max-width: 34ch; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="title">Live tracking</h1>
  <span id="status" class="pill">connecting…</span>
</header>

<div id="map"></div>

<div class="sheet" id="sheet">
  <div class="who">
    <div class="ph" id="avatar">🧑‍✈️</div>
    <div style="min-width:0">
      <h2 id="driverName">—</h2>
      <div class="sub" id="vehicleName">—</div>
    </div>
    <div class="plate hidden" id="plate">—</div>
  </div>

  <div class="leg">
    <div class="rail"><i></i><span></span><i class="end"></i></div>
    <div class="names">
      <div><div class="lbl">PICKUP</div><span id="pickupName">—</span></div>
      <div><div class="lbl">DROP</div><span id="dropName">—</span></div>
    </div>
  </div>

  <div class="meta">
    <div class="chip" id="chipDist">—</div>
    <div class="chip" id="chipDur">—</div>
    <div class="chip hidden" id="chipDepart">—</div>
  </div>

  <div class="note" id="note">Waiting for the driver's position…</div>
</div>

<!-- Terminal states -->
<div class="screen" id="screenEnd">
  <div>
    <div class="icon" id="endIcon">🏁</div>
    <h2 id="endTitle">This trip has ended</h2>
    <p id="endBody">You can close this page.</p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // The token is the ONLY credential, and it comes from this page's own URL — never templated
  // into the HTML server-side, so it cannot be reflected anywhere. Everything below writes with
  // textContent, so nothing from the API is ever parsed as markup either.
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const API = location.origin + '/api/v3';

  const state = { rideType: null, rideId: null, map: null, car: null, follow: true, seen: 0 };

  const setStatus = (text, cls) => { $('status').textContent = text; $('status').className = 'pill ' + (cls || ''); };
  const setNote = (text, cls) => { $('note').textContent = text; $('note').className = 'note ' + (cls || ''); };

  const end = (icon, title, body) => {
    $('endIcon').textContent = icon;
    $('endTitle').textContent = title;
    $('endBody').textContent = body;
    $('screenEnd').classList.add('show');
  };

  // ── the map ──────────────────────────────────────────────────────────────
  // Leaflet + OpenStreetMap, deliberately not Google Maps: the only Maps key this backend holds is
  // a SERVER-side Distance Matrix key, and a public tracking page would expose it to anyone the
  // rider forwards the link to. OSM needs no key at all.
  const mapAvailable = typeof L !== 'undefined';

  const initMap = () => {
    if (!mapAvailable) return;
    state.map = L.map('map', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(state.map);
    state.map.setView([22.9734, 78.6569], 5);   // India, until we know better

    // Any manual pan stops the map fighting the user for control.
    state.map.on('dragstart', () => { state.follow = false; });
  };

  const pinIcon = (cls) => L.divIcon({ className: '', html: `<div class="dot ${cls}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
  const carIcon = () => L.divIcon({ className: '', html: '<div class="car">🚗</div>', iconSize: [34, 34], iconAnchor: [17, 17] });

  const drawRoute = (pickup, drop) => {
    if (!state.map || !pickup || !drop) return;

    L.marker([pickup.latitude, pickup.longitude], { icon: pinIcon('p') }).addTo(state.map).bindPopup('Pickup');
    L.marker([drop.latitude, drop.longitude], { icon: pinIcon('d') }).addTo(state.map).bindPopup('Drop');

    // A straight line, not the driven route. Drawing a real road path would need a Directions
    // call per render; this is an orientation aid, and labelling it dashed keeps that honest.
    L.polyline([[pickup.latitude, pickup.longitude], [drop.latitude, drop.longitude]], {
      color: '#2a2f3a', weight: 3, dashArray: '6 8',
    }).addTo(state.map);

    state.map.fitBounds(
      L.latLngBounds([[pickup.latitude, pickup.longitude], [drop.latitude, drop.longitude]]),
      { padding: [50, 50] }
    );
  };

  const moveCar = (lat, lng, at) => {
    state.seen++;
    if (state.map) {
      if (!state.car) state.car = L.marker([lat, lng], { icon: carIcon(), zIndexOffset: 1000 }).addTo(state.map);
      else state.car.setLatLng([lat, lng]);

      if (state.follow) state.map.panTo([lat, lng], { animate: true, duration: 0.6 });
    }
    const when = at ? new Date(at).toLocaleTimeString() : 'just now';
    setNote(`Driver is on the way · last update ${when}`, 'ok');
    setStatus('live', 'ok');
  };

  // ── 1. the snapshot ──────────────────────────────────────────────────────
  // A share link is an opaque token, so the page cannot know which product it belongs to. Both
  // endpoints are tried, QuickRide first because it is far more common — the same order the socket
  // handshake uses. Whichever answers also tells us the rideType we must join with.
  const fetchSnapshot = async () => {
    for (const rideType of ['quickride', 'outstation']) {
      const path = rideType === 'quickride' ? '/quick-rides/track/' : '/outstation-rides/track/';
      try {
        const res = await fetch(API + path + encodeURIComponent(token));
        if (res.ok) return { rideType, snap: await res.json() };
      } catch (_) { /* network hiccup — fall through and let the caller report it */ }
    }
    return null;
  };

  const render = (snap, rideType) => {
    $('title').textContent = rideType === 'outstation' ? 'Outstation trip' : 'Live tracking';

    $('driverName').textContent = snap.driver?.name || 'Your driver';
    if (snap.driver?.profileImageUrl) {
      const img = document.createElement('img');
      img.src = snap.driver.profileImageUrl;
      img.alt = '';
      img.onerror = () => img.replaceWith($('avatar'));
      $('avatar').replaceWith(img);
    }

    const v = snap.vehicle;
    $('vehicleName').textContent = v ? [v.vehicleName, v.vehicleType].filter(Boolean).join(' · ') : 'Vehicle details unavailable';
    if (v?.vehicleNumber) { $('plate').textContent = v.vehicleNumber; $('plate').classList.remove('hidden'); }

    $('pickupName').textContent = snap.pickupLocationName || '—';
    $('dropName').textContent = snap.dropLocationName || '—';

    $('chipDist').innerHTML = '';
    $('chipDist').append(document.createTextNode('Trip '));
    const b1 = document.createElement('b'); b1.textContent = `${snap.estimatedDistanceKm} km`; $('chipDist').append(b1);

    $('chipDur').innerHTML = '';
    $('chipDur').append(document.createTextNode('About '));
    const b2 = document.createElement('b'); b2.textContent = `${snap.estimatedDurationMin} min`; $('chipDur').append(b2);

    if (snap.pickupAt) {
      $('chipDepart').innerHTML = '';
      $('chipDepart').append(document.createTextNode('Departs '));
      const b3 = document.createElement('b'); b3.textContent = new Date(snap.pickupAt).toLocaleString(); $('chipDepart').append(b3);
      $('chipDepart').classList.remove('hidden');
    }

    drawRoute(snap.pickupCoordinates, snap.dropCoordinates);
    if (snap.lastLocation) moveCar(snap.lastLocation.latitude, snap.lastLocation.longitude, snap.lastLocation.at);
  };

  // ── 2 + 3. connect, then JOIN ────────────────────────────────────────────
  // The join is not optional. A viewer socket is authenticated but sits in no room until it asks,
  // so skipping this leaves a live connection that never receives a single position.
  const connect = () => {
    const socket = io(location.origin, { auth: { trackingToken: token }, transports: ['websocket'] });

    socket.on('connect', () => {
      socket.emit('ride:join', { rideId: state.rideId, rideType: state.rideType }, (ack) => {
        if (!ack?.ok) {
          setStatus('unavailable', 'err');
          setNote(ack?.message || 'Could not join this trip.', 'err');
        }
      });
    });

    socket.on('connect_error', () => {
      setStatus('offline', 'err');
      setNote('Lost connection — retrying…', 'err');
    });

    socket.on('disconnect', () => { setStatus('reconnecting…', 'warn'); });

    socket.on('ride:location', (p) => moveCar(p.latitude, p.longitude, p.at));

    socket.on('ride:join_error', (p) => {
      setStatus('unavailable', 'err');
      setNote(p.message || 'This trip is no longer being tracked.', 'err');
    });

    // Outstation only, and NOT a teardown: the room stays up for the journey. The map keeps
    // running; only the caption changes, from "on the way to the pickup" to "under way".
    socket.on('outstation:picked_up', () => {
      setNote('The rider is on board — the trip is under way.', 'ok');
    });

    // The teardown. Three reasons, all terminal, both products.
    socket.on('ride:ended', (p) => {
      socket.disconnect();
      switch (p.reason) {
        case 'completed':
          return end('🏁', 'Trip completed', 'The rider has arrived. You can close this page.');
        case 'cancelled':
          return end('🚫', 'Trip cancelled', 'This trip was cancelled, so there is nothing left to track.');
        case 'expired':
          return end('⌛', 'Trip expired', 'No driver took this trip in time.');
        default:
          return end('🏁', 'This trip has ended', 'You can close this page.');
      }
    });
  };

  // ── boot ─────────────────────────────────────────────────────────────────
  (async () => {
    if (!token) {
      return end('🔗', 'Broken link', 'This tracking link is missing its code. Ask for a fresh one.');
    }

    initMap();
    if (!mapAvailable) setNote('Map tiles could not be loaded — trip details below are still live.', 'err');

    const found = await fetchSnapshot();

    // An unknown token and a trip that has finished, been cancelled or expired are all a 404 from
    // the API, on purpose: a shared link must not reveal which.
    if (!found) {
      return end('🔒', 'This link is no longer valid', 'The trip may have finished or been cancelled. Ask for a new link if it is still running.');
    }

    state.rideType = found.rideType;
    state.rideId = found.snap.rideId;

    render(found.snap, found.rideType);
    setStatus('connecting…', 'warn');
    connect();
  })();
})();
</script>
</body>
</html>
